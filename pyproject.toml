
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amtools"
version = "0.1.0"
description = "Tools for actuator-based methods."
authors = [
    { name = "Dylan Green", email = "dylan.green@eng.ox.ac.uk" }
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "numpy",
    "scipy",
    "pyvista",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

examples = [
	"matplotlib",
	"ipykernel",
]

[project.urls]
Homepage = "https://github.com/UoO-Tidal-and-Wind/Actuator-Method-Tools"
Issues = "https://github.com/UoO-Tidal-and-Wind/Actuator-Method-Tools/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
